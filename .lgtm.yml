# v0.14.0 stress-test config for LGTM's .lgtm.yml wiring.
version: 1

# Test: auto_approve_docs_only — docs-only PRs should skip the LLM entirely
# and get an APPROVE review posted immediately.
auto_approve_docs_only: true

# Test: skip_lockfile_changes — lockfile-only PRs should skip the LLM.
skip_lockfile_changes: true

# Test: paths[].skip — files matching this pattern should never be reviewed.
paths:
  - pattern: "**/*.generated.ts"
    skip: true
  - pattern: "src/legacy/**"
    skip_agents: ["readability", "best-practices"]

# Test: disabled_agents — the documentation agent should never fire on this repo.
disabled_agents:
  - documentation

# Test: max_inline_comments — cap review noise on this repo.
max_inline_comments: 5

# Test: suppress_categories — missing-jsdoc findings should never surface.
suppress_categories:
  - "missing-jsdoc"
